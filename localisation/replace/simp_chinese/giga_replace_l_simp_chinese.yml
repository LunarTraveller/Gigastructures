 ap_master_builders_desc:0 "建造巨构建筑需要超乎想象的资源存贮和预案计划。我们正在迈向宏观工程的全新层面。\n\n该飞升天赋是以下飞升天赋的前提：\n§Y$ap_vast_expanses$§!"
 transcendence_tooltip:0 "需要此科技的研究选项：\n£society_research£§Y$giga_tech_psychic_hypersiphon_1$§!\n\n我们物种的全体成员将觉醒全部灵能潜力。"
 ap_voidborn_desc:1 "虚空，曾被视为一道冰冷而不可逾越的屏障，如今却成了我们的第二家园。我们已经适应了太空深处的永久居住，这将降低建造基础设施的资源需求，并使我们的居住站提供更多空间以用于其他功能。\n\n需要此飞升天赋的研究选项：\n£engineering_research£§Y$giga_tech_interstellar_habitat$§!"
 enable_colossus_project:0 "发布特殊项目：巨像计划\n\n以该飞升天赋为前提的飞升天赋：\n§Y$ap_vast_expanses$§!\n\n"
 tr_unyielding_finish_desc:1 "\n§E解锁特殊巨构建筑：§!§R$name_maginot$§!\n需要此飞升天赋的研究选项：\n£society_research£§Y$giga_tech_maginot_world$§!\n\n$MOD_STARBASE_DEFENSE_PLATFORM_CAPACITY_MULT$ §G+50%§!\n$mod_starbases_upkeep_mult$ §G-20%§!\n允许使用§Y$military_federation$§!联邦类型\n解锁飞升天赋槽：§G+1§!"
 tr_unyielding_federations_finish_desc:1 "\n§E解锁特殊巨构建筑：§!§R$name_maginot$§!\n需要此飞升天赋的研究选项：\n£society_research£§Y$giga_tech_maginot_world$§!\n\n$MOD_STARBASE_DEFENSE_PLATFORM_CAPACITY_MULT$ §G+50%§!\n$mod_starbases_upkeep_mult$ §G-20%§!\n允许使用§Y$military_federation$§!联邦类型\n解锁飞升天赋槽：§G+1§!"
