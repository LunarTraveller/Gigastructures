 habitat_central_complex_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$——$giga_list_category_habitable_mega$\n建造一座可通过增建§Y轨道舱段§!进行扩展的人工§Y居住站§!\n§L$habitat_complex$是由多个自维持空间站组成的永久居住集群，附属卫星站可实现对整个恒星系的资源开发。§!"
