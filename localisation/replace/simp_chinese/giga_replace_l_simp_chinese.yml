 matter_decompressor_0:0 "$gc_mega$物质解压器基址"
 matter_decompressor_0_MEGASTRUCTURE_DETAILS:3 "£gigastructural£$giga_list_category_megastructure$——$giga_list_category_basic_resource_production$\n从§Y黑洞§!中开采£minerals£§Y矿物§!\n§L这个$matter_decompressor_4$将黑洞的引力聚焦于一处，形成了一个引力钻头，我们可以用这个钻头从黑洞的奇点中钻取物质，并转化为矿物。§!"
