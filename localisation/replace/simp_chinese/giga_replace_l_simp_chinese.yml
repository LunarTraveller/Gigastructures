 strategic_coordination_center_0:0 "$gc_mega$战略指挥中心基址"
 strategic_coordination_center_0_MEGASTRUCTURE_DETAILS:0 "£galwonders£$giga_list_category_megastructure$——$giga_list_category_military$\n提高§Y海军容量§!，§Y舰船速度§!，§Y恒星基地容量§!和§Y防御平台容量§!\n§L可以将全国上下恒星基地网络进行同步化处理的设施，提升基地的防御及攻击能力。§!"
 orbital_ring:0 "$gc_kilo$星环基地"
 orbital_ring_tier_1_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$——$giga_list_category_miscellaneous$\n为§Y行星§!提供额外的§Y特化§!和§Y防御§!能力\n§L§Y$orbital_ring_tier_1$§!是一种环绕行星的环带状恒星基地，可以提供防卫以及其他各种特化功能。§!"
 orbital_ring_tier_1_CONSTRUCTION_INFO_DELAYED:1 "$giga_list_additional_data$——星环基地可以为行星提供防卫增益，上面可以修建许多恒星基地模块和建筑，同时还有居住模块或在轨生产设施。"
 quantum_catapult_0:0 "$gc_mega$量子弹弓基址"
 quantum_catapult_0_MEGASTRUCTURE_DETAILS:1 "£galwonders£$giga_list_category_megastructure$——$giga_list_category_transportation$\n以§Y有限精度§!将§Y舰队§!弹射至星系各处\n§L一个用来汇聚中子星或脉冲星引力以扭曲空间，将舰队传送至遥远距离之外的装置。§!"
 quantum_catapult_0_CONSTRUCTION_INFO_DELAYED:1 "$giga_list_additional_data$——量子弹弓的每一次运行都会让舰队到达预定目的地§H之外§!的恒星系。这个“§Y散射半径§!”能够通过后续升级减少。"
 hyper_relay:0 "$gc_kilo$超空间中继器"
 hyper_relay_MEGASTRUCTURE_DETAILS:1 "$giga_list_category_kilostructure$——$giga_list_category_transportation$\n若组成§Y跨星系§!的§Y链式网络§!，则可大幅缩短§Y通行时间§!\n§L尽管单独不起作用，形成链式结构的超空间中继器可以提供相邻恒星系间的快速穿越。§!"
 orbital_arc_furnace_1:0 "$gc_kilo$ $orbital_arc_furnace_4$：赤道环带"
 orbital_arc_furnace_1_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$——$giga_list_category_advanced_resource_production$\n使用熔融星球的洪荒之力，§Y$orbital_arc_furnace_4$§!解锁了此前无法获取的矿物，并提升了整个恒星系的采矿作业能力。\n§L该装置可将庞大系统转化为高效能的动力核心§!"
 dyson_swarm_1:0 "$gc_kilo$$dyson_swarm_3$：阵列"
 dyson_swarm_1_MEGASTRUCTURE_DETAILS:1 "£gigastructural£ £megaupgrade£$giga_list_category_kilostructure$——$giga_list_category_basic_resource_production$\n§Y$dyson_swarm_3$§!是一大组设计用于提升恒星产出的互联卫星。\n§L一个§Y$dyson_swarm_3$§!是通向§Y$dyson_sphere_5$§!的终极能源的垫脚石。"
 dyson_swarm_1_DESC:1 "§Y$dyson_swarm_3$§!是一大组设计用于提升恒星产出的互联卫星。"
 dyson_swarm_2_DESC:1 "§Y$dyson_swarm_3$§!是一大组设计用于提升恒星产出的互联卫星。"
 dyson_swarm_3_DESC:1 "§Y$dyson_swarm_3$§!是一大组设计用于提升恒星产出的互联卫星。"
 cosmogenesis_world_0:0 "$gc_crisis$$pc_cosmogenesis_world$"
 cosmogenesis_world_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_crisis$——$giga_list_category_science_production$\n一座庞大的储备式计算机，通过消耗人口来产出§Y研究点数§!和§Y超然逻辑§!。其效率和损耗率随人口增加而攀升。\n§L为了一窥现实深层的意义，我们需要一种新的科学...§!"
 cosmogenesis_needle:0 "$gc_crisis$$NAME_Cosmogenesis_Sphere$"
 cosmogenesis_needle_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_crisis$——$giga_list_category_special$\n为了飞升到我们自己创造的现实中，必须在永远离开这个宇宙之前，让我们的整个文明登上视界刺针。\n§L这是对宇宙法则的公然僭越。§!"
 grand_archive_0:0 "$gc_kilo$$grand_archive$"
 grand_archive_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$——$giga_list_category_miscellaneous$\n保存及展示我们在整个星系中收集而来的最具有价值的文物。\n§L一座专用的轨道设施，旨在收容并展示我们在银河系中收集的各类珍贵样本，包括活体太空兽群。§!"
 crisis_sphere_0:0 "$gc_crisis$以太相引擎框架"
 crisis_sphere_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_crisis$-$giga_list_category_special$\n$crisis_sphere_0_DESC$\n§L思想不再受限于羸弱的肉体，而现实将任由我们摆布。诚然，没有比这更高的境界了。§!"
 galactic_crucible_0:0 "$gc_crisis$星系熔炉框架"
 galactic_crucible_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_crisis$-$giga_list_category_special$\n这座庞大的空间站从宿主恒星中汲取能量，驱动自动化船厂制造足以重塑恒星命运的舰船——§Y$entropy_conduit_plural$§!。\n§L$galactic_crucible_0_DESC$§!"
 deep_space_citadel_0:0 "$gc_kilo$$tech_deep_space_citadel$"
 deep_space_citadel_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$-$giga_list_category_defensive$\n§Y$deep_space_citadel_0$§!是一座以最大化恒星重力井内防御能力为目的设计的武装恒星基地。\n§L$deep_space_citadel_0_DESC$§!"
 shroud_seal:0 "$SHROUD_SEAL$"
 shroud_seal_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_psionics$\n§Y$SHROUD_SEAL$§!会衰减附近的§Y$PSIONIC_AURA_PLURAL$§!。该星系中的§Y$PSIONIC_AURA$§!强度衰减$@shroud_seal_decrease|0$，相邻星系衰减-1。\n§L$shroud_seal_DESC$§!"
 behemoth_egg: "$gc_crisis$噬天巨兽卵"
 behemoth_egg_DESC: "一个巨大的有机容器，其中孵育着一只§Y噬天巨兽§!。"
 behemoth_egg_MEGASTRUCTURE_DETAILS: "$giga_list_category_crisis$ - $giga_list_category_special$\n这个结构支持着§Y噬天巨兽卵§!的发育。\n§L$behemoth_egg_DESC$§!"
 concept_automodding_hab_preference_desc: "普通：\n—['trait:trait_auto_dry_preference']\n—['trait:trait_auto_wet_preference']\n—['trait:trait_auto_cold_preference']\n\n特殊：\n—['trait:trait_auto_pc_nuked_preference']\n—['trait:trait_auto_pc_gaia_preference']\n—['trait:trait_auto_pc_hive_preference']\n\n人工：\n—['trait:trait_auto_pc_city_preference']\n—['trait:trait_auto_pc_relic_preference']\n—['trait:trait_auto_pc_habitat_preference']\n—['trait:trait_auto_pc_ringworld_habitable_preference']\n—['trait:trait_auto_pc_cosmogenesis_world_preference']\n- ['trait:trait_auto_pc_alderson_slice_preference']"