 d_giga_lifeless_zro_1:0 "泽珞矿藏"
 d_giga_lifeless_zro_1_desc:0 "这个星球有可开发的泽珞粉尘源。"
 d_giga_lifeless_dark_matter_1:0 "暗物质矿藏"
 d_giga_lifeless_dark_matter_1_desc:0 "这个星球有可开发的暗物质源。"
 d_giga_lifeless_living_metal_1:0 "活金属矿藏"
 d_giga_lifeless_living_metal_1_desc:0 "这个星球有可开发的活体金属源。"
 d_giga_lifeless_nanites_1:0 "纳米矿藏"
 d_giga_lifeless_nanites_1_desc:0 "这个星球有可开发的纳米机器人源。"
 d_giga_lifeless_iodizium_1:0 "解离素矿藏"
 d_giga_lifeless_iodizium_1_desc:0 "这个星球有可开发的解离素水晶源。"
 d_giga_hab_iodizium_1:0 "解离素矿藏"
 d_giga_hab_iodizium_1_desc:0 "这个居住站复合体建造在一个可开发的解离素水晶矿藏附近。"
 d_small_natural_tunnel:0 "北风通道"
 d_small_natural_tunnel_desc:0 "此星球上，一片大陆中央的大型湖泊和海洋经由此小型自然通道连接起来。这一通道的存在就像是无视一切自然定律一般，也由此让土著相信这是神迹。"
 d_arcane_mineral_generator:0 "神秘嬗变师"
 d_arcane_mineral_generator_desc:0 "一个神秘的古代装置，能凭空生产出矿物资源。"
 d_giga_orbital_effects:0 "恒星系运输网络"
 d_giga_orbital_effects_desc:0 "$name_giga_orbital$主导着当地后勤计划。"
 d_pcc_origin_blocker:0 "残破的回路"
 d_pcc_origin_blocker_desc:0 "这颗行星上大片大片的处理阵列都因计算子区块间的连接受损而无法为我们的研究设施所利用。"
 d_giga_rogue_ai_relay_servers:0 "失控的处理器阵列"
 d_giga_rogue_ai_relay_servers_desc:0 "失控的人工智能控制着大量的处理器阵列以及服务器，并藉由这些设备来控制行星计算机群，想方设法地破坏基建和杀戮我们的殖民者来反抗我们的控制。"
 d_giga_rogue_ai_corrupt_code:0 "损坏的代码"
 d_giga_rogue_ai_corrupt_code_desc:0 "行星计算机群的数据库中有大块大块的危险过时代码，不断阻碍着我们在这颗星球上进行的科研活动。"
 d_ringworld_capital_city: "宏伟首都"
 d_ringworld_capital_city_desc: "建于环世界上的一座宏伟首都城市。这一城市扮演着此环世界区段的中心功能，并为当地人口提供各项服务。"
 d_interstellar_ringworld_commerce_blocker: "废弃基建"
 d_interstellar_ringworld_commerce_blocker_desc: "环世界提供了几乎无限的空间，因此人们很少考虑土地再开发利用问题，这导致了大片区域布满了长期废弃的建筑。如果能清理开发这些区域，当地商业无疑会显著增长，增加帝国财富。"
 d_great_ring_excavated_mountain:0 "环世界自我修复系统节点"
 d_great_ring_excavated_mountain_desc:0 "环世界自动化自我修复系统裸露的节点。它持续生成维持巨构建筑正常运转所需的物质。只要操作得当，我们就能从中抽取部分物质满足自身需求，而不会危及到它的运转。"
