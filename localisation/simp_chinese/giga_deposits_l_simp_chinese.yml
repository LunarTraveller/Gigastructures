 d_decrepit_tunnels_squareworld_desc:0 "$d_decrepit_tunnels_1_desc$"
 d_predictable_solar_flares: "可预测的太阳耀斑"
 d_predictable_solar_flares_desc: "我们母星环绕的恒星在太阳耀斑爆发前会有特定行为发生，因此可以轻松提取能量。"
