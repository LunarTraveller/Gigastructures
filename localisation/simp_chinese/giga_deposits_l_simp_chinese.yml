 d_flusio_arcology_wreck:0 "巨型城市之墟"
 d_flusio_arcology_wreck_desc:0 "弗鲁森理想城发生的战斗部分或完全地毁坏了这片城市。"
 d_flusio_arcology_anarchy:0 "弗鲁森无政府地带"
 d_flusio_arcology_anarchy_desc:0 "为了将喵星大帝赶下台的战斗造成的连带损害令弗鲁森上的大片区域沦为了无政府地带。"
 d_flusio_arcology_administration: "弗鲁森理想城管理机构"
 d_flusio_arcology_administration_desc: "想要治理好弗鲁森那堪称噩梦一般的后勤可不是一件易事。鉴于弗鲁森理想城可容纳大量的区划，我们必须多加小心管理才是。"
 d_flusio_arcology_administration_tooltip: "[giga_flusion_administration_mechanics]"
 d_solaktropa_project:0 "罗夸托帕计划"
 d_solaktropa_project_desc:0 "罗夸托帕计划以干扰弗鲁森的自然气候为代价，为喵星提供了大量的土地以资建设所用，同时也为农业提供大量灌溉用水。"
 d_solaktropa_project_wreck:0 "罗夸托帕之墟"
 d_solaktropa_project_wreck_desc:0 "罗夸托帕大坝的毁灭给弗鲁森和其居民带来了无以复加的灾难。"
 d_katlantropa_project:0 "喵特兰托帕计划"
 d_katlantropa_project_desc:0 "喵特兰托帕计划灌溉着此前的茫茫荒漠，将其驯化为可资农业和灌溉所用的土地。"
 d_katlantropa_project_wreck:0 "喵特兰托帕荒漠化"
 d_katlantropa_project_wreck_desc:0 "喵特兰托帕的毁灭将此前改造而来的耕地又变回了广袤的沙漠。"
 d_aeternum_gigantic_fission_reactor:0 "巨型裂变反应堆"
 d_aeternum_gigantic_fission_reactor_desc:0 "永世帝国在偏远地区建造的奇特裂变反应堆，依靠巨型铀块运行，产出巨量电力。"
 d_exp_civ_primitive_preserve:0 "伯奇世界原始文明保护区"
 d_exp_civ_primitive_preserve_desc:0 "一整个栖息在伯奇世界一隅的原始文明。有着巨大的科研潜力。"
 d_exp_civ_space_preserve:0 "伯奇世界太空时代文明保护区"
 d_exp_civ_space_preserve_desc:0 "一整个栖息在伯奇世界一隅的太空时代文明。有着巨大的科研潜力。"
 d_exp_civ_fe_preserve:0 "伯奇世界先驱者文明保护区"
 d_exp_civ_fe_preserve_desc:0 "一整个栖息在伯奇世界一隅的先驱者文明。有着巨大的科研潜力。"
 d_aeternum_decaying_hyperstructure:0 "衰败中的超结构"
 d_aeternum_decaying_hyperstructure_desc:0 "这一伯奇世界的大片区域在数千年的荒废后已经破败不堪。修复无疑是个浩大的工程，但这也能让我们再次拓展伯奇世界的宜居区域。\n\n清理这里能给我们提供§G3§!$aeternum_tech_intel$。"
