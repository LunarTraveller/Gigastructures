 giga_log.500.title:0 "可选数据记录"
 giga_log.500.desc:0 "感谢游玩 Gigastructural Engineering & More！\n\n至今为止，我们根据玩家的反馈进行了诸多调整。为了将模组打磨至最佳，我们认为收集玩家的数据对平衡性决策将具有不可估量的价值。\n\n如果你愿意，你可以通过启用日志功能，记录你在使用 Gigastructures 游玩时的星系状态，从而协助我们。每次游戏结束后，你可以将 game.log 文件和模组列表上传至下方链接 <SOMEWHERE>中的问卷里。启用日志可能在每年年初造成少量卡顿，对此不便，我们深表歉意。\n\n§H注意§!：由于日志文件的工作机制，每次打开 Stellaris 时，日志文件都会被清空。你将无法发送或查看先前游戏进程中的日志文件。\n\n§L无论是 Gigastructures 还是任何 Stellaris 模组，都不具备存储你的数据或向任何地方发送遥测信息的能力。Gigastructures 或其开发团队任何成员所收到的数据，全都仅仅是你自愿提供的内容。Stellaris 的日志文件中不会包含任何私密信息，除非你自行添加了此类数据。§!"
 giga_log.500.a:0 "是的，我想启用日志记录。"
 giga_log.500.b:0 "不，我不想启用日志记录。"