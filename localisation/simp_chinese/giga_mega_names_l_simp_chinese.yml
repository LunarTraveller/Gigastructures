 sr_mega_extra_data:0 "可§Y揭示§!并§Y扩大§!战略资源矿藏，同时§Y增强§!（但不会生成）常规资源矿藏。"
 giga_tech_orbital_artificial_eco:0 "轨道生态系统"
 giga_tech_orbital_artificial_eco_desc:0 "在行星轨道上构建一个运行良好的复杂生态系统极具挑战，但这项技术的诞生使我们得以在轨道上建立用于科研的大型生态系统。"
 orbital_artificial_eco_0:0 "$gc_kilo$$name_orbital_artificial_eco$：生命维持系统"
 orbital_artificial_eco_0_DESC:0 "该基地将用于建造$name_orbital_artificial_eco$，一座内部承载着完整的人造生态系统的大型结构，足以供我们自由开展各类实验。"
 orbital_artificial_eco_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$-$giga_list_category_science_production$\n在恒星系内行星上生成£society_research£§Y社会学研究§!。\n§L一座建于剧毒星球轨道上的空间站，用于容纳并研究大量异星动植物物种。§!"
 orbital_artificial_eco_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$-$orbital_eco_arcology_1_mod_tooltip$"
 orbital_artificial_eco_1:0 "$name_orbital_artificial_eco$：基因存储库"
 orbital_artificial_eco_1_DESC:0 "一组外部装置，用于功能性地储存规划中$name_orbital_artificial_eco$内所有物种的基因信息，以便在物种灭绝时能够实现复育重现。"
 orbital_artificial_eco_2:0 "$name_orbital_artificial_eco$：异星生态舱"
 orbital_artificial_eco_2_DESC:0 "这些异星舱室内建有多种模拟生态环境，并配有专门设施以确保所有动植物种群的可持续繁衍。"
 orbital_artificial_eco_3:0 "$name_orbital_artificial_eco$：行星级实验"
 orbital_artificial_eco_3_DESC:0 "一座完整的$name_orbital_artificial_eco$，内部栖息着通过基因工程引入或合成的多种物种。借助这座独特的生态系统，科学家们得以随意模拟与调整环境，深入探索自然运作的奥秘。"
 orbital_artificial_eco_ruined:0 "毁坏的$name_orbital_artificial_eco$"
 orbital_artificial_eco_ruined_DESC:0 "一座毁坏的$name_orbital_artificial_eco$。曾经在其可控环境中栖息着大量经生物工程培育的物种，如今却早已人去园空。若掌握相应技术，或许仍有重建之机。"
 orbital_artificial_eco_ruined_MEGASTRUCTURE_DETAILS:0 "$orbital_artificial_eco_ruined_DESC$"
 orbital_artificial_eco_restored:0 "$name_orbital_artificial_eco$"
 orbital_artificial_eco_restored_DESC:0 "$orbital_artificial_eco_3_DESC$"
 giga_dialog.1003.name:0 "毁坏的$name_orbital_artificial_eco$"
 giga_dialog.1003.desc:0 "我们发现在[from.GetName]恒星系中有一个位于气态巨行星轨道的毁坏$name_orbital_artificial_eco$。其虽遭受重创，但外部框架仍大致保留完好。我们的科学家认为，若掌握相应技术，或许有望将其修复。"
 giga_dialog.1003.a:0 "有趣。"
 macro_test_site_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$-$orbital_test_site_1_mod_tooltip$"
 atmosphere_shredder_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$-$orbital_atmosphere_shredder_1_mod_tooltip$"
 giga_dialog.403.name:0 "毁坏的$name_eng_test_site$"
 giga_dialog.403.desc:0 "我们的舰船探测到一个相当大的空间站正绕[from.GetName]恒星系内的行星运行。经过进一步调查，这个空间站实际上是荒废的$name_eng_test_site$，由某个未知物种在很久以前建造。这个空间站可能是过去多项实验的测试场地，但很不幸已成为废墟。"
 giga_dialog.403.a:0 "$INTRIGUING$"
 giga_tech_planetary_seeder_nexus:0 "大规模极端微生物培育"
 giga_tech_planetary_seeder_nexus_desc:0 "无论炎热或寒冷，荒芜星球经常存在生命的基本构件，只是并未恰当组合。而随着我们发现克苏卤伊德与变形虫能在太空深处繁盛，如今出现了创造定制人工“生命体”的可能——一旦将其投放于无生命星球，它们将能聚集并重排这些基本构件，生成适于采收与食用的各类物质。由于其仅是将分散分子重组为可食化合物，因此需要定期补充，也无法构成真正的“生物圈”，但可为我们的营养工业提供有用的材料来源。"
 planetary_seeder_nexus_0:0 "$gc_kilo$$name_planetary_seeder_nexus$：有机生物传感 "
 planetary_seeder_nexus_0_DESC:0 "该站点将作为$name_planetary_seeder_nexus$的建造基础——一种轨道生物工程设施，用于生产准生物自动机，将无生命星球中的分散有机化合物再处理为可食用物质。大型地质勘察阵列持续扫描附近世界并部署探针，以确认可处理有机化合物的高浓度区位。"
 planetary_seeder_nexus_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_basic_resource_production$\n在恒星系的行星上生成£food£§Y食物§!矿藏。\n§L环绕气态巨行星建造的站点，生产生物自动机，以将有机化合物再处理为可食用物质。§!"
 planetary_seeder_nexus_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - $planetary_seeder_nexus_1_mod_tooltip$"
 planetary_seeder_nexus_1:0 "$name_planetary_seeder_nexus$：生物制造厂"
 planetary_seeder_nexus_1_DESC:0 "大量生产营养型类浮游生物生命体，它们可在地下海洋、岩质地壳与气态大气中蓬勃发展，随后向所在恒星系扩散。"
 planetary_seeder_nexus_2:0 "$name_planetary_seeder_nexus$：酶工厂"
 planetary_seeder_nexus_2_DESC:0 "针对无法维持常规生命的星球，先进工厂会制造富含酶的细胞自动机，这些自动机拥有不可思议的分子化学能力：从将富碳星球的地壳与大气重塑为蔗糖晶柱，到利用碳氢化合物与水生成蛋白浆等。"
 planetary_seeder_nexus_3:0 "$name_planetary_seeder_nexus$"
 planetary_seeder_nexus_3_DESC:0 "完整的$name_planetary_seeder_nexus$，负责在该恒星系几乎所有星球上生产、部署并随后采收专用酶与营养生命体。"
