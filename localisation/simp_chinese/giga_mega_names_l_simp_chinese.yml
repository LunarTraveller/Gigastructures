 penrose_sphere_a2_DESC:0 "$name_penrose$已经重新用作炸弹。在引爆前需要积累一段时间的能量。"
 penrose_sphere_a3:0 "子空间畸变炸弹"
 penrose_sphere_a3_DESC:0 "围绕黑洞建造的巨大镜面状结构，能够在内表面和黑洞能层间来回反射辐射，引起超辐射散射，并指数放大辐射能量。"
 penrose_sphere_a4:0 "引爆！"
 penrose_sphere_a4_DESC:0 "送入足够辐射，使镜面完整性超过极限，释放能量流！"
