 giga_qso.3000.name:0 "类星体和平"
 giga_qso.3000.desc:0 "§R令人不安的消息！§!\n\n随着我们的$name_quasistellar$关键部分的竣工，整个银河系似乎开始将我们视为对银河安全的共同威胁。事实上，所有非灭绝政体帝国于今日达成了一项无期限的停火协议，并签订了被称为“类星体和平”的互不侵犯条约。他们已经决定，至少在目前，先搁置彼此间微不足道的争端，以确保我们无法用超级武器威胁银河系的安全……"
 giga_qso.3000.a:0 "他们以为这会有用？"
 giga_fed.3012.name:0 "§R宣战！§!"
 giga_fed.3012.desc:0 "[root.GetName]，我们决不能让你们的邪恶行径继续下去了。\n\n这是一份正式的宣战声明。立即投降，或许我们还能让你们的文明免遭毁灭。"
 giga_fed.3012.a:0 "可悲。"
 giga_fed.3006.name:0 "银河防御公约"
 giga_fed.3006.desc:0 "[root.GetName]正在建造一件足以威胁到我们已知文明的超级武器。\n\n因此，在[giga_galactic_pact_president.GetName]的倡议下，我们正式宣告成立§B银河防御公约§!。作为一个旨在捍卫银河系未来的联邦，我们将彻底终结[root.GetName]的邪恶行径。\n\n我们绝不会任由自己被你们日益膨胀的狂妄野心所冲垮，[root.GetName]。"
 giga_fed.3006.a:0 "想必只是虚张声势罢了。"
 giga_fed.3006.b:0 "无趣。"
 giga_fed.3006.c:0 "这就是你们能想出的全部对策？"
 giga_fed.3006.d:0 "好极了，这会让我们的工作更轻松。"
 giga_fed.3005.name:0 "§B银河防御公约§!"
 giga_fed.3005.desc:0 "银河系中不计其数的星际国家通常很难为了一个共同的目标携手合作。然而，随着[root.GetName]开始建造一件巨大的超级武器，银河系中大部分残存的帝国达成了一项堪称外交奇迹的无期限停火协议，并且在搁置分歧后，联合成了一个名为§B银河防御公约§!的跨银河联邦。\n\n这个由[giga_galactic_pact_president.GetName]领导的庞大联邦，旨在保护银河系免受[root.GetName]毁灭性超级武器的威胁，而他们采取攻势行动显然只是时间问题……"
 giga_fed.3005.a:0 "如走投无路的鼠辈般抱团取暖。"
 giga_fed.4012.name:0 "§R宣战！§!"
 giga_fed.4012.desc:0 "[root.GetName]，我们决不能让你们对银河系的疯狂破坏继续下去了。\n\n这是一份正式的宣战声明。无论付出什么代价，我们都要将你们彻底击溃！"
 giga_fed.4012.a:0 "可悲的蠢货。"
 giga_fed.4011.name:0 "泛银河防御联盟"
 giga_fed.4011.desc:0 "银河系的居民们！\n\n[root.GetName]正在着手建造一件武器，一旦完工，它足以终结我们所知银河系内的所有生命。因此，为了捍卫这片银河的未来，我们正式宣告成立泛银河防御联盟，并将竭尽全力确保[root.GetName]的邪恶计划不会得逞。\n\n我们要让你们知道，我们绝不会悄无声息地遁入黑夜，[root.GetName]！"
 giga_fed.4011.a:0 "蠢货！你们……你们无法阻止我们！"
 giga_fed.4010.name:0 "§B泛银河防御联盟§!的诞生"
 giga_fed.4010.desc:0 "银河系向来是一个危险的地方，从微小的边境冲突到全面的银河大战，各种规模的战争在整个银河历史中屡见不鲜。\n\n然而，[root.GetName]最近开始建造一件超级武器，其规模与范围之惊人，令以往建造的任何事物都相形见绌。在短暂的清醒中，银河系中的所有人都突然明白了一件事：与这件武器一旦完工所将释放的毁灭相比，他们之间那些微不足道的冲突与争吵根本不值一提。\n\n因此，在[giga_galactic_pact_president.GetName]的倡议下，银河系残存的势力决定搁置分歧，联合成一个名为§B泛银河防御联盟§!的跨银河超级国家——至少在[root.GetName]对银河系构成威胁的这段时期内会保持团结。\n\n这个庞大的帝国能否成功阻止[root.GetName]的毁灭行径，抑或是只会加速银河系的灭亡？看来我们很快就会知道答案了……\n\n§R泛银河联邦的完全成型可能需要几分钟的时间。§!"
 giga_fed.4010.a:0 "这……这阻止不了我们！"
 giga_qso.2000.name:0 "$name_quasistellar$基址竣工！"
 giga_qso.2000.desc:0 "我们位于银河核心的$name_quasistellar$基址已经竣工！悬浮于超大质量类星体旁，这座平台将被用作基座，以组装一件规模前所未见的武器。这尊噬天巨兽所蕴藏的毁灭性力量是如此庞大，以至于与它相比，$name_ndb$不过是个微不足道的爆竹罢了。我们的第一步将是压缩类星体的吸积盘，以便开始这座超级武器本体的建造工作。"
 giga_qso.2000.a:0 "收到。"
 giga_qso.2001.name:0 "$name_quasistellar$吸积压缩器竣工！"
 giga_qso.2001.desc:0 "我们建造这件超级武器的第一步已经完成。一座巨大的不完整环带已在类星体周围组装完毕，它正对高能吸积盘施加巨大的引力压迫，迫使其收缩至更小的规模。这将使我们能够在不受吸积盘阻碍的情况下，完成这件超级武器余下的部分。"
 giga_qso.2001.a:0 "为了无限的力量，这点代价微不足道。"
 giga_qso.2002.name:0 "$name_quasistellar$相对论性偏转器竣工！"
 giga_qso.2002.desc:0 "我们的$name_quasistellar$距离正式激活又近了一步。两座巨大的收集器通过庞大的电容器与燃料管道网络与结构的其余部分相连，它们将收集类星体的两极喷流，并将其能量重新定向输送至巨构的主武器。现在，我们必须开始建造管理这件庞大超级武器所必需的巨型计算阵列。"
 giga_qso.2002.a:0 "很好。"
 giga_qso.2003.name:0 "$name_quasistellar$超级计算机竣工！"
 giga_qso.2003.desc:0 "我们的$name_quasistellar$超级计算机现已竣工。这组庞大的计算机器负责维护巨构结构，并确保开火程序顺利进行。它同样能够管理这件武器即将引导的海量能量。现在我们必须开始着手建造电容器，以便将这些能量输送至武器本体。"
 giga_qso.2003.a:0 "很好。"
 giga_qso.2004.name:0 "$name_quasistellar$万亿级电容器竣工！"
 giga_qso.2004.desc:0 "我们超级武器的万亿级电容器现已组装完毕。作为一组巨大的交汇环带，它们引导并存储从类星体收集到的海量能量，并在启动开火程序时，将其重新定向输送至超级武器。现在只剩下最后一步了，那就是建造这件超级武器最重要的部分——其巨大的主炮。"
 giga_qso.2004.a:0 "极好。很快，我们将拥有无限的力量。"
 giga_qso.2005.name:0 "$name_quasistellar$竣工！"
 giga_qso.2005.desc:0 "终于。在银河核心的超大质量类星体附近经历了数十载危险且艰苦卓绝的工作后，我们的伟大杰作终于竣工了。\n\n$name_quasistellar$是一件规模前所未见的武器，甚至令$name_ndb$都相形见绌。它的能量输出大约相当于20万亿颗恒星的总和，能够向其不幸的目标倾泻难以估量的毁灭力量。它是我们对这片宇宙拥有终极掌控力的证明，亦是我们让苍穹屈服于自身意志之能力的明证。\n\n随着这件横跨数百个天文单位的庞大超级武器的完工，我们的敌人现在唯一能做的，就只有祈求宽恕了。"
 giga_qso.2005.a:0 "终于，最大的巨炮是我们的了！"
 giga_qso.001.name:0 "$name_quasistellar$控制面板"
 giga_qso.001.desc:0 "欢迎使用$name_quasistellar$控制面板。\n\n在此处，你可以为这件超级武器选择打击目标，或者配置其各项参数。\n\n选择目标将允许你瞄准恒星、行星或是舰队。请记住，发射类星天陨需要消耗由该巨构建筑自身产生的£giga_sr_quasaric_energy£§Y类星体能量§!。\n\n查看参数可以让你更改武器的充能速率，从而增加或减少我们的类星天陨所积累的£giga_sr_quasaric_energy£§Y类星体能量§!总量。\n\n§B该菜单亦可通过法令直接开启。§!"
 giga_qso.001.fire:0 "目标管理"
