 giga.qso.maxtargetedplanets:0 "我们锁定的行星数量已达上限，在尝试选择更多目标前，请至少取消选择一个目标。"
 giga.qso.maxtargetedsystems:0 "我们锁定的恒星系数量已达上限，在尝试选择更多目标前，请至少取消选择一个目标。"
 giga.qso.canttargetsystemtwice:0 "我们无法重复锁定同一个恒星系。"
 giga.qso.noclustertodestroy:0 "没有待摧毁的已锁定星团。"
