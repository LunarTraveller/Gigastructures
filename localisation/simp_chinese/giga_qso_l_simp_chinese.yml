 giga_qso.005.desc:0 "请选择要锁定的恒星系。"
 giga_qso.006.desc:0 "请为类星天陨选择一种锁定模式。\n\n锁定§Y星团§!将把该星系本身及其所有相邻星系标记为摧毁目标。受$giga_fe_shield$或$d_maginot_subspace_disruptor$保护的相邻星系将不受影响。\n\n锁定§Y恒星系§!将仅把该星系标记为摧毁目标，保留周围星系完好无损。\n§T当前已锁定星系：§!§Y[root.giga_qso_targeted_systems]/4§!\n\n锁定§Y行星§!将把选定的行星标记为摧毁目标，保留星系完好无损。你最多可以同时锁定跨越多个星系或帝国的§Y10§!颗行星。\n§T当前已锁定行星：§!§Y[root.giga_qso_targeted_planets]/10§!"
 giga_qso.006.a:0 "锁定星团"
 giga_qso.006.b:0 "锁定恒星系"
 giga_qso.006.c:0 "锁定行星"
 giga_qso.007.desc:0 "请最多选择§Y10§!颗要锁定的行星。这些行星无需位于同一个恒星系，甚至无需属于同一个帝国。\n\n§T当前已锁定行星：§!§Y[root.giga_qso_targeted_planets]/10§!"
 giga_qso.0070.desc:0 "请确认你希望对指定的星团开火。一旦确认将无法回头，且§R指定的星团将被摧毁。§!"
 giga_qso.0071.desc:0 "请确认你希望对指定的恒星系开火。一旦确认将无法回头，且§R指定的恒星系将被摧毁。§!\n\n§T当前已锁定恒星系：§!§Y[root.giga_qso_targeted_systems]/4§!"
