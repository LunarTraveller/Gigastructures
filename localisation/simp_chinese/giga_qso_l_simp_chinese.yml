l_simp_chinese:
 giga_tech_quasi_stellar_1:0 "超维护盾"
 giga_tech_quasi_stellar_1_desc:0 "类星体是蕴含着惊人能量的天体。如果我们希望在其附近开展任何形式的工程项目，就必须研发先进的护盾，以保护我们的建筑设施免受类星体引力与辐射的影响。"
 giga_tech_quasi_stellar_2:0 "引力吸积压缩"
 giga_tech_quasi_stellar_2_desc:0 "银河核心的超类星体被一个巨大且极具能量的吸积盘所环绕。显而易见，这使得在类星体附近进行任何组装工作都变得不可能。然而，通过改变类星体周边的引力常数，我们可以有效模拟该天体质量的增加，从而迫使吸积盘收缩至更小的规模。这实际上不仅提升了它的能量潜能，还允许我们在更靠近类星体的位置建造设施。"
 giga_tech_quasi_stellar_3:0 "相对论性喷流偏转"
 giga_tech_quasi_stellar_3_desc:0 "超大质量类星体最显著的特征之一是存在两条巨大的喷流，它们由高度加速的电离物质组成，并以相对论速度从类星体的两极喷射而出。这些喷流蕴含着极高的能量，若能收集并重新定向其毁灭性的能量，将对我们未来超级武器的供能大有裨益。"
 giga_tech_quasi_stellar_4:0 "万亿级计算机器"
 giga_tech_quasi_stellar_4_desc:0 "$name_quasistellar$的规模极其庞大。如果我们希望妥善维护这座巨构，并管理这台超级武器所调用的惊人能量，就需要配备同样巨大的计算机系统。"
 giga_tech_quasi_stellar_5:0 "类星体能量操纵"
 giga_tech_quasi_stellar_5_desc:0 "想要收集、存储并重新定向超大质量类星体所释放的庞大能量，需要融合多项极其先进的技术，其涵盖了从超维电容器到超引力场调制的各个尖端领域。"
 giga_tech_quasi_stellar_6:0 "$name_quasistellar$"
 giga_tech_quasi_stellar_6_desc:0 "$name_quasistellar$是一种运用了我们已知几乎所有技术的武器，旨在将整个银河系中能量最高的天体改造为一件兵器。这个令人生畏的构造体确乎是超大尺度武器的巅峰之作，甚至比$name_ndb$和恒星系统飞船还要高出好几个数量级。"
 quasi_stellar_obliterator_0:0 "$gc_tera$$name_quasistellar$基址"
 quasi_stellar_obliterator_0_DESC:0 "悬浮于一颗巨大的超大质量类星体旁，这里是未来$name_quasistellar$的基址。这个相对微小的平台将被用作基座，用于建造银河系智慧生物有史以来所组装的最宏伟、也最离谱的超级武器。"
 quasi_stellar_obliterator_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_terastructure$：$giga_list_category_weaponry$\n围绕§Y超类星体§!建造一件足以摧毁整个§Y星团§!的超级武器！\n§L围绕类星体建造的、规模大得离谱的超级武器，拥有难以估量的破坏力。§!"
 quasi_stellar_obliterator_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$：§Y类星天陨§!能够摧毁单一§Y行星§!、§Y恒星系§!甚至整个§Y星团§!。"
 quasi_stellar_obliterator_1:0 "$name_quasistellar$吸积压缩器"
 quasi_stellar_obliterator_1_DESC:0 "这座环绕着类星体的巨大不完整环带运用了超维超引力压缩机来局部改变引力常数，从而有效压缩了类星体狂暴的吸积盘。"
 quasi_stellar_obliterator_2:0 "$name_quasistellar$相对论性偏转器"
 quasi_stellar_obliterator_2_DESC:0 "一组设计精密的能量导管与超高效偏转器被用于小心地收集并重新定向类星体的两极喷流，从而为我们的超级武器提供海量的可用能源。"
 quasi_stellar_obliterator_3:0 "$name_quasistellar$超级计算机"
 quasi_stellar_obliterator_3_DESC:0 "这些庞大的计算机被整合在这件超级武器巨大的框架内，以便妥善控制并调节从类星体收集到的海量能量流，同时维持整个结构的整体稳定。"
 quasi_stellar_obliterator_4:0 "$name_quasistellar$万亿级电容器"
 quasi_stellar_obliterator_4_DESC:0 "这些环绕着类星体的庞大环带被用于从吸积盘与彭罗斯过程中汲取能量，并将其重新定向输送至任何需要的地方，无论是巨大的储能单元，还是武器本身。"
