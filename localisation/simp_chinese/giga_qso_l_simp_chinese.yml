 giga_qso.008.name:0 "$name_quasistellar$：参数"
 giga_qso.008.desc:0 "在此处，你可以管理类星天陨本身的能源输出与消耗。\n\n提高类星天陨的§Y充能速率§!将会增加其£giga_sr_quasaric_energy£§Y$giga_sr_quasaric_energy$§!产出，但代价是带来更高的£energy£§Y$energy$§!维护费。\n\n降低充能速率将会减少其£giga_sr_quasaric_energy£§Y$giga_sr_quasaric_energy$§!产出，作为回报，类星天陨的£energy£§Y$energy$§!维护费将会降低、归零，甚至转化为£energy£§Y$energy$§!产出。\n\n你还可以将各种资源，例如£minerals£§Y$minerals$§!、£food£§Y$food$§!、£consumer_goods£§Y$consumer_goods$§!、£alloys£§Y$alloys$§!、£giga_sr_bulk_matter£§Y$giga_sr_bulk_matter$§!以及§R其他资源……§!倾倒进下方的黑洞中，以快速获取少量的£giga_sr_quasaric_energy£§Y$giga_sr_quasaric_energy$§!。"
 giga_qso.009.name:0 "$name_quasistellar$：资源倾倒"
 giga_qso.009.desc:0 "在此处，你可以将各种资源，例如£minerals£§Y$minerals$§!、£food£§Y$food$§!、£consumer_goods£§Y$consumer_goods$§!、£alloys£§Y$alloys$§!、£giga_sr_bulk_matter£§Y$giga_sr_bulk_matter$§!以及§R其他资源……§!倾倒进下方的黑洞中，以快速获取少量的£giga_sr_quasaric_energy£§Y$giga_sr_quasaric_energy$§!，请"
