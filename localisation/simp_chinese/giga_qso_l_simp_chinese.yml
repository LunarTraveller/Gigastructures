 giga_birch.300.name:0 "超类星体"
 giga_birch.300.desc:0 "经过一段艰难跋涉，[Root.GetName]终于抵达了银河系的中心。\n一进入该星系，船员们便被眼前一颗无比巨大的§Y活跃超大质量类星体§!（或称超类星体）的景象所震撼。\n\n这个庞然大物重达数亿恒星质量，直径达数百个天文单位。\n尽管目前这仅仅是推测，但科学界中一些最狂热的分子提出理论：也许可以围绕这颗类星体建造一件巨大的超级武器，以此驾驭其灾难性的能量，释放出一道具有难以估量的毁灭力量的光束。"
 giga_birch.300.a:0 "难以置信！"
 giga_qso.110.name:0 "机械星球被抹除"
 giga_qso.110.desc:0 "在$name_quasistellar$的虫洞出现于其上空的那一刻，这颗机械星球的结局便已注定。紧接着，一股相当于整个银河系总能量输出的庞大能量流从虫洞中喷发而出。这道光束仅用了区区数秒，便将这颗行星彻底抹除。\n\n昔日的机器世界已荡然无存，幽灵信号也因此遭到了严重削弱。"
 giga_qso.110.a:0 "让他们长点记性。"
 giga_qso.112.name:0 "肃正协议的终结"
 giga_qso.112.desc:0 "肃正协议已经失败。随着最后一颗机械星球被摧毁，银河系不再面临系统性大灭绝的威胁——至少来自肃正协议的威胁已然消除。所有残存的肃正协议战体都已停机或自毁，幽灵信号也已停止发送。\n\n主枢纽在区区数秒内便被$name_quasistellar$威力无比的激光彻底抹除，什么也没有留下。\n\n尽管肃正协议已不复存在，但[quasistellar_owner.GetName]是否会将他们的超级武器瞄准其他目标，仍有待观察……"
 giga_qso.112.a:0 "在万亿烈日的伟力面前，他们又能做些什么呢？"