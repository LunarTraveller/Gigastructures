 quasi_stellar_gateway_off:0 "类星天陨星门"
 quasi_stellar_gateway_off_DESC:0 "在原理上与$name_ndb$的星门类似，这个贯穿亚空间的传送门能够瞬间传输海量的能量。"
 quasi_stellar_gateway_off_MEGASTRUCTURE_DETAILS:0 "$quasi_stellar_gateway_off_DESC$"
 quasi_stellar_gateway_on:0 "激活的类星天陨星门"
 quasi_stellar_gateway_on_DESC:0 "在原理上与$name_ndb$的星门类似，这个贯穿亚空间的传送门能够瞬间传输海量的能量。"
 quasi_stellar_obliterator_5:0 "$name_quasistellar$"
 quasi_stellar_obliterator_5_DESC:0 "一台完整且全面运作的$name_quasistellar$。通过从类星体的两极喷流、吸积盘以及彭罗斯过程中汲取能量，这件庞大的超级武器能够将相当于整个银河系恒星能量总和的怒火，倾泻在不幸的目标身上。"
 quasi_stellar_obliterator_6:0 "类星天陨控制面板"
 quasi_stellar_obliterator_6_DESC:0 "打开这件超级武器的控制面板，以对其进行开火或配置。"
 quasi_stellar_marker_star_firing:0 "类星天陨虫洞"
 quasi_stellar_marker_star_firing_DESC:0 "一台$name_quasistellar$正通过这个虫洞开火。"
