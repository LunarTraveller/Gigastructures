 giga.qso.nosystemtodestroy:0 "没有待摧毁的已锁定恒星系。"
 giga.qso.nosystemtoremove:0 "没有可移除的已锁定恒星系。"
 giga.qso.noplanetstodestroy:0 "没有待摧毁的已锁定行星。"
 giga.qso.noplanetstoremove:0 "没有可移除的已锁定行星。"
 giga_qso.002.name:0 "类星天陨"
 giga_qso.002.desc:0 "这是$name_quasistellar$§E目标管理菜单§!，在此处你可以根据目标国家针对§Y[root.GetName]§!的阵营立场来进行选择。\n\n§R敌对§!目标通常包括：['concept_marauder_empires']、['concept_endgame_crises']以及与我们处于交战状态的帝国。\n\n§Y中立§!目标通常包括：['concept_preftl_civilizations']，与我们处于和平状态但未与我们建立['concept_subject_agreement']、['concept_federation']或签订特定['concept_diplomatic_pacts']的帝国。\n\n§G友善§!目标包括：我们自身国境内的自有恒星系。"
