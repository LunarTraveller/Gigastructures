 concept_giga_character_dofus:0 "多福斯·特克尼克·玛奇纳"
 concept_giga_character_dofus_desc:0 "自AKA历19年至喵尾的征伐为止，多福斯·特克尼克·玛奇纳一直担任罗夸利亚的监督总统。他有时有些天真。"
