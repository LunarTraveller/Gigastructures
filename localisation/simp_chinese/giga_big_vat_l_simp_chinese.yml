l_simp_chinese:
 giga_tech_the_vat:0 "卡冈都亚克隆设施"
 giga_tech_the_vat_desc:0 "基因工程新纪元的到来，为更宏大、更雄心勃勃的工程铺平了道路。以往局限于地表的克隆技术已被迁移到了庞大的轨道克隆设施上。这使我们可以快速进行生物工程改造，并培育出真正的太空生物舰队来进一步壮大我们的海军。"
 giga_dialog.11301.name:0 "$name_the_vat$基址完工"
 giga_dialog.11301.desc:0 "$name_the_vat_long$的基址已经完工。这座轨道平台将作为中转站，建造有史以来规模最大的生物培养舱所需的各类设施。\n\n一旦建成，它将能够快速生产大量生物个体来为我们的舰队效力。"
 giga_dialog.11301.a:0 "很好"
 giga_dialog.11302.name:0 "主培养舱建成"
 giga_dialog.11302.desc:0 "我们的轨道克隆设施的主培养舱现已建造完成。作为同类设施中规模最大的克隆培养舱，它能够培育各种设计规格的巨型克隆体。\n\n§Y击败生物型利维坦后，即可在任意生物活性增长舱的主培养舱中进行克隆。§!  "
 giga_dialog.11302.a:0 "太棒了"
 giga_dialog.11303.name:0 "第一、第二辅助培养舱建造完成"
 giga_dialog.11303.desc:0 "$name_the_vat_long$的建造又迈出了关键一步。这些辅助培养舱的建成允许我们能够同时克隆更多样本，显著提升整体结构的运作效率。"
 giga_dialog.11303.a:0 "很好"
 giga_dialog.11304.name:0 "第三、第四辅助培养舱建造完成"
 giga_dialog.11304.desc:0 "$name_the_vat_long$的建造工程再进一步。新增的这些培养舱将实现多个克隆体的并行生产，大幅提升产能。"
 giga_dialog.11304.a:0 "太棒了！"
 giga_dialog.11305.name:0 "第五、第六辅助培养舱建造完成"
 giga_dialog.11305.desc:0 "$name_the_vat_long$已经建成。凭借六座辅助培养舱与一座巨型主培养舱，我们现在能够在极短时间内克隆出整支由庞然异兽组成的舰队，这将让我们以前所未有的方式主宰战场。"
 giga_dialog.11305.a:0 "让克隆开始吧。"
 the_vat_0:0 "$gc_mega$ $name_the_vat$建造基址"
 the_vat_0_DESC:0 "未来培养舱的建造基地，工程师与生物学家所需的一切均已就位，只待将其打造为一座巨型克隆设施。"
 the_vat_0_MEGASTRUCTURE_DETAILS:0 "£galwonders£ $giga_list_category_megastructure$——$giga_list_category_ship_production$\n消耗£food£§Y$food$§!来建造§Y生物战舰§!，其原型基于已知的§Y利维坦§!与§Y太空生物§!。\n§L生物活性增长舱是一座轨道克隆设施，可大规模生产生物太空舰船。§!"
 the_vat_1:0 "$name_the_vat$：主培养舱"
 the_vat_1_DESC:0 "这将成为同类型中规模最大的培养舱，可批量培育巨型克隆体。"
 the_vat_2:0 "$name_the_vat$：辅助培养舱"
 the_vat_2_DESC:0 "$the_vat_1_DESC$额外的辅助培养舱可提高克隆速度。"
 the_vat_3:0 "$name_the_vat$：辅助培养舱"
 the_vat_3_DESC:0 "$the_vat_1_DESC$额外的辅助培养舱可进一步提高克隆速度。"
 the_vat_4:0 "$name_the_vat$"
 the_vat_4_DESC:0 "这是同类型中规模最庞大的克隆培养舱，能够批量培育巨型克隆体。凭借六座辅助舱与一座巨型主舱，该设施已准备好量产整支由庞然异兽组成的舰队。"
 the_vat_menu_title:0 "§c生物活性增长舱§!"
 the_vat_menu_desc:0 "§c生物活性增长舱§!是一座生物船坞。主舱的克隆速度是辅助舱的两倍。\n\n请注意：克隆生物舰队时会随机选择设计方案，若想避免改装费用，请谨慎操作。"
