 giga_maximum_mutation_title: "§c突变已达上限§!"
 giga_maximum_mutation_desc: "追求基因命运的途中必须考虑所有的途径，尽管他们看起来可能会奇怪而神秘。"
 giga_prethoryn_larvae: "孵化完成的幼虫"
 giga_prethoryn_larvae_desc_short: "一只正在蠕动的小小幼虫。成长飞快，也能被一脚踩死"
 giga_prethoryn_larvae_desc_details: ""
 giga_vat_maximum_mutation_1: "最大化突变：起始"
 giga_vat_maximum_mutation_2: "最大化突变：致命"
 giga_vat_maximum_mutation_3: "最大化突变：至臻"
 giga_vat_maximum_mutation_4: "最大化突变：升华"
 giga_vat_maximum_mutation_1_DESC: "这是一个很好的开端，它决定了我们突变的走向。此项计划是否真如其支持者所言那般成功，唯有时间能揭晓。"
 giga_vat_maximum_mutation_2_DESC: "后续的步骤与开端同等重要。若未筑牢根基，宫殿何以拔地千仞？"
 giga_vat_maximum_mutation_3_DESC: "任何项目都需反复修订与审视。我们该如何改进设计？哪些缺陷可以最小化？此刻，正是我们的样品登临完美之时。"
 giga_vat_maximum_mutation_4_DESC: "为山九仞，仍需最后一篑。"
 giga_vat_events.100.name: "最大化突变"
 giga_vat_events.100.desc: "凭借如此庞大而高效的克隆设备阵列，我们的科学家提出了一个极为诡异的构想——若将帝国收集的所有基因样本，无论其来源为何，都进行混合与突变，究竟会催生出什么？尽管这一想法荒诞不经，但它也许能推动生物学突破，而该项目孕育出的生物或许能在银河战争的舞台上派上用场。"
 giga_vat_events.100.a: "能有什么问题呢？"
 giga_vat_events.101.name: "起始"
 giga_vat_events.101.desc: "初步实验的结果令人振奋，[capital.GetName]的科学家们正准备进行更大规模的实验。借助$name_the_vat$的庞大实验室设施，他们打算培育出相当于护卫舰体型的实验体。至于其性能究竟会逊色于还是超越真正的护卫舰——仍有待观察。"
 giga_vat_events.101.a: "$INTRIGUING$"
 giga_vat_events.1011.name: "起始之孕"
 giga_vat_events.1011.desc: "我们注视着它成长，注视着它进食。自始至终，愤怒、恐惧、挫败——我们不知为何能感知它的情绪。它如此庞大，却又如此渺小，并依然畏惧着我们。它本可瞬间将我们碾碎或溶解。为何它会恐惧？是害怕攻击我们后招致的报复？还是恐惧我们将要创造的下一个存在？"
 giga_vat_events.1011.a: "$DISCONCERTING$"
 giga_vat_events.102.name: "致命"
 giga_vat_events.102.desc: "继起始的成功之后，首席科学家提议开展一项规模堪比驱逐舰的更大规模实验。尽管团队内部存在诸多质疑，项目仍获批准，更激进的突变研究就此启动。"
 giga_vat_events.102.a: "$GOOD$"
 giga_vat_events.1021.name: "致命之力"
 giga_vat_events.1021.desc: "狂怒。一切情绪都让位于暴力与愤怒的混沌。它猛烈冲撞着束缚自己的装置，试图将空间站碾成碎片。它日复一日地挣扎，这暴怒似乎永无止境。与此同时，我们发现那些小型实验体也产生了异变——它们被交织着恐惧的相似怒意所感染。它们之间仿佛存在着某种超越血缘的深层联系，就像同属于某个更庞大的生命体。"
 giga_vat_events.1021.a: "$DISTURBING$"
 giga_vat_events.103.name: "至臻"
 giga_vat_events.103.desc: "自项目启动以来，我们的海军上将和其他军事人员对此表现出极大兴趣。他们要求获得一种具备近乎航母级作战能力的样本。驻守于$name_the_vat$上的科学家多数已辞职或拒绝参与，但仍有少数精锐为追求完美继续推进。"
 giga_vat_events.103.a: "$INCREDIBLE$"
 giga_vat_events.1031.name: "基因飞升"
 giga_vat_events.1031.desc: "又发狂了。这次比之前都更骇人。挣扎的力道也成倍暴增。某天一切躁动戛然而止。那天只有一种感觉。服从。他们成功了，他们终于降服了自己创造的暴烈生物。当这个生物臣服时，其余样本一同臣服。不再愤怒、恐惧或沮丧。唯见服从。这个生命体已经接纳了我们。"
 giga_vat_events.1031.a: "$ASTOUNDING$"
 giga_vat_events.104.name: "升华"
 giga_vat_events.104.desc: "我们已经臻至完美，但如果再进一步呢？在登峰造极之后，是否还有更高的可能？团队中有人提议去突破极限。如果成功，或许我们就能触及进化的终点。"
 giga_vat_events.104.a: "$UNDERSTOOD$"
 giga_vat_events.1041.name: "突变已最大化"
 giga_vat_events.1041.desc: "终极生命体，我们美丽的造物，终于在此刻诞生于我们眼前。它们的力量将让敌人在银河舞台上挑战我们前不得不三思。我们通过这项计划获得了独一无二的馈赠——我们与这些样品之间出现了某种联结。我们的意识与它们的意识交织，宛如一体。若将这样的力量在银河中释放，后果将不可估量。在培育过程中，曾有实验体试图逃脱。万幸的是，所有出逃者均被消灭。确实有少数个体成功逃离后遁入了星际空间，但想必它们也掀不起什么风浪。"
 giga_vat_events.1041.a: "当然…"
