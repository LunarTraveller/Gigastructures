l_simp_chinese:
 giga_gas_giant_home_system_NAME:0 "气态巨行星家园"
 giga_gas_giant_home_system_DESC:0 "以宜居的气态巨行星开局，你之前的母星已被摧毁。"
 origin_gas_giant: "气态巨行星升空"
 origin_gas_giant_desc: "在此帝国仍在太空发展初期之时，一颗流浪彗星袭击了他们的母星。由于这个帝国当时已拥有在太空中暂时生存所需的基础设施，一个气态巨行星采矿站便被他们改造为了新家。时光荏苒，这颗气态巨行星远不止一次地满足了他们的需求，还为他们带来了对浩瀚河系中各类气体的新见解。得益于帝国发展过程中从未缺少过的异星天然气，他们改良并精进了利用这些气体的工业技术，不过这也令帝国最为基本的工业也仰赖于天然气。"
 origin_gas_giant_robot: "气态巨行星升空"
 origin_gas_giant_robot_desc: "在此帝国仍在太空发展初期之时，一颗流浪彗星袭击了他们的母星。由于这个帝国当时已拥有在太空中暂时生存所需的基础设施，一个气态巨行星采矿站便被他们改造为了新家。时光荏苒，这颗气态巨行星远不止一次地满足了他们的需求，还为他们带来了对浩瀚河系中各类气体的新见解。得益于帝国发展过程中从未缺少过的异星天然气，他们改良并精进了利用这些气体的工业技术，不过这也令帝国最为基本的工业也仰赖于天然气。"
 origin_gas_giant_effects: "- $HOMEWORLD$ ['concept_giga_habitable_gas_giant'] (规模: £planetsize£ 16-28)$NEW_LINE$- 物种特质:$TABBED_NEW_LINE$- ['trait:trait_giga_gas_giant_hab']$NEW_LINE$- $ADDITONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$- ['technology:tech_space_mining_1', £engineering_research£ $tech_space_mining_1$]$TABBED_NEW_LINE$- ['technology:tech_hydroponics', £society_research£ $tech_hydroponics$]"
 origin_gas_giant_effects_robot: "- $HOMEWORLD$ ['concept_giga_habitable_gas_giant'] (规模: £planetsize£ 16-28)$NEW_LINE$- 物种特征:$TABBED_NEW_LINE$- ['trait:trait_giga_gas_giant_hab_robot']$NEW_LINE$- $ADDITONAL_TECHNOLOGIES_STRING$ ['technology:tech_space_mining_1', £engineering_research£ $tech_space_mining_1$]"
 concept_giga_habitable_gas_giant: "$pc_habitable_gas_giant$"
 concept_giga_habitable_gas_giant_desc: "$pc_habitable_gas_giant_desc$"
 concept_giga_gas_worlds: "气态行星"
 concept_giga_gas_worlds_desc: "宜居气态巨行星，其上带有人工形成的天然气大气层，甚至一些较为宜居的有毒星球也被归于“气态行星”之列。"
 building_giga_gas_giant_habitation_module: "气态巨行星居住模块"
 building_giga_gas_giant_habitation_module_desc: "用以维持气态巨行星殖民地运作的一系列必要设施，由此气态巨行星的原初居民建造。这些设施包括为殖民地供能的反应堆、卸载从卫星上收集的矿物的船坞和一个可用于水培农业的大型气候控制港。此外，这些设施还被用作资源分配网络的总部，并为当地人口提供各类服务。"
 trait_giga_gas_giant_hab:0 "异星天然气依赖"
 trait_giga_gas_giant_hab_desc:0 "§L数世纪以来，这一物种因居住在气态巨行星上而暴露于异星天然气中。某种程度上，异星天然气已经成为了他们日常生活功能不可或缺的一部分。§!"
 trait_giga_gas_giant_hab_tooltip:0 "§Y科研§!和§Y工业§!岗位的异星天然气维护费：§R+0.03§!\n—['concept_giga_gas_worlds', §YGas§!]星球的住房使用：§G-10%§!\n—['concept_giga_gas_worlds', §YGas§!]星球的£job_researcher£$job_researcher$维护费：§G-10%§!\n—['concept_giga_gas_worlds', §YGas§!]星球岗位的异星天然气维护费：§G-33%§!\n—非['concept_giga_gas_worlds', §YGas§!]星球的住房使用：§R+30%§!\n—非['concept_giga_gas_worlds', §YGas§!]星球的宜居性：§R-20%§!\n—非['concept_giga_gas_worlds', §YGas§!]星球岗位的异星天然气维护费：§R+50%§!"
 trait_giga_gas_giant_hab_robot:0 "异星天然气驱动"
 trait_giga_gas_giant_hab_robot_desc:0 "§L随着时间推移，这些机器在自我改造中逐步积累变化，最终几乎完全依赖异星天然气作为运作能量来源。"
 trait_giga_gas_giant_hab_robot_tooltip:0 "$trait_giga_gas_giant_hab_tooltip$"
 giga_gas_giant_hab_colony_tt:0 "对于气态巨行星升空物种来说可以视作一个['concept_giga_gas_worlds', §YGas§!]星球"
